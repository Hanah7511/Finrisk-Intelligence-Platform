[project]
name = "financial-risk-intelligence-engine"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["shared*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
###The include = ["shared*"]  restricts discovery to shared and its subpackages — it won't try to also package finrisk_detection_engine or finintel_sentinel_ai, which run as their own standalone apps.